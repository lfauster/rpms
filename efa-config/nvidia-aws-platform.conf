# This setting overrides PCIe topology checks for NVIDIA GB200 GPUs
# to enable proper GPUDirect RDMA mappings. This is also harmless on
# any other NVIDIA platform.
options nvidia NVreg_GrdmaPciTopoCheckOverride=1
